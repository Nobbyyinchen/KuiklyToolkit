name: Standalone build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-and-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use isolated Gradle home
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/kuikly-toolkit-gradle" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Check standalone boundaries and documentation
        run: |
          python3 scripts/check_independence.py
          python3 scripts/check_docs.py
      - name: Install Android platform
        run: sdkmanager 'platforms;android-34'
      - name: Build libraries, examples, APK and tests from public dependencies
        run: >-
          ./gradlew --no-daemon
          :kuikly-toolkit:jsNodeTest
          :kuikly-lenient-serialization:jsNodeTest
          :kuikly-toolkit:compileReleaseKotlinAndroid
          :kuikly-lenient-serialization:compileReleaseKotlinAndroid
          :sample:compileKotlinJs
          :sample:compileReleaseKotlinAndroid
          :android-demo:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kuikly-toolkit-android-demo
          path: android-demo/build/outputs/apk/debug/android-demo-debug.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-demo-evidence
          path: build/demo-evidence
          if-no-files-found: warn
