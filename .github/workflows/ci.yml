name: Standalone build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-and-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use isolated Gradle home
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/kuikly-toolkit-gradle" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Check standalone boundaries
        run: python3 scripts/check_independence.py
      - name: Install Android platform
        run: sdkmanager 'platforms;android-34'
      - name: Build libraries, examples and tests from public dependencies
        run: >-
          ./gradlew --no-daemon
          :kuikly-toolkit:jsNodeTest
          :kuikly-lenient-serialization:jsNodeTest
          :kuikly-toolkit:compileReleaseKotlinAndroid
          :kuikly-lenient-serialization:compileReleaseKotlinAndroid
          :sample:compileKotlinJs
          :sample:compileReleaseKotlinAndroid
